# Release workflow for VCF Operations Open Telegraf Helper.
# Builds multi-platform standalone executables (Linux, Windows, macOS ARM64 and x86_64).
#
# Signing is the org's shared actions in sentania-labs/.github (pinned by commit
# below; onboarding checklist in that repo's README): Developer ID signing and
# notarization on macOS, Authenticode through Azure Artifact Signing on Windows.
# The credentials are org secrets visible to every repo; nothing is configured
# here. Signing is mandatory, not "if secrets are configured": before this
# there was no Windows signing at all and the macOS steps keyed on secret
# names that never existed, so every release shipped unsigned binaries. A
# managed Windows desktop refuses an unsigned .exe outright (2026-10-06 eval,
# finding N-A).
#
# The release therefore depends on Apple and Azure being up at tag time. If
# notarization or signing fails for a reason that is not this binary (Apple
# 403s, service outages), `gh run rerun <id> --failed` resumes it; publish is
# idempotent per tag.
#
# Placement (github-ci skill): GitHub-hosted runners for multi-OS build matrix.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse to start without every macOS signing secret
        uses: sentania-labs/.github/.github/actions/signing-secrets-present@899421db1380620b2d4e2d8ac8b6acf16fe15b99 # sentania-labs/.github main 2026-10-07
        with:
          macos-cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          macos-team-id: ${{ secrets.MACOS_TEAM_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}

      - name: Refuse to start without every Windows signing secret
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
        run: |
          # windows-sign checks these itself, but only after the macOS legs may
          # have spent up to two hours on Apple. Fail here, in seconds.
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Windows signing org secrets with no value:$missing"
            exit 1
          fi

      - name: Refuse tag not reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not reachable from main; refusing to release"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system graphics libraries for offscreen Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Run test and lint suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip "ruff~=0.16.0"
          python -m pip install -e '.[gui]' pytest pytest-asyncio respx hypothesis
          make check

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: windows-latest
            name: windows
            ext: ".exe"
          - os: macos-latest
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            name: macos-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gui]' pyinstaller

      - name: Build standalone binary
        shell: bash
        run: |
          python -m PyInstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name "vcf-telegraf-helper-${{ matrix.name }}" \
            --copy-metadata vcf-ops-telegraf-helper \
            --collect-all vcf_ops_telegraf_helper \
            --collect-all tzdata \
            --collect-all winrm \
            --hidden-import PySide6 \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            vcf_ops_telegraf_helper/cli/main.py

      # Sign before the smoke test so the smoke runs the SIGNED binary: a
      # signature that breaks startup (hardened runtime vs PyInstaller's
      # one-file unpack) is caught in seconds, before Apple's notarization
      # round trip. Known gap: the smoke commands never import PySide6 (the
      # GUI import is lazy and `gui` blocks on an event loop), so a signed
      # binary whose Qt libraries fail under hardened runtime would pass here
      # and fail on a user's Mac at `gui`. The migrator proves the Python
      # runtime under the same entitlement; Qt is unproven until a release is
      # run by hand or a non-blocking Qt smoke exists.
      - name: Sign the binary (macOS)
        if: runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-sign@899421db1380620b2d4e2d8ac8b6acf16fe15b99 # sentania-labs/.github main 2026-10-07
        with:
          binary: dist/vcf-telegraf-helper-${{ matrix.name }}
          macos-cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          macos-team-id: ${{ secrets.MACOS_TEAM_ID }}

      - name: Sign the binary (Windows)
        if: runner.os == 'Windows'
        uses: sentania-labs/.github/.github/actions/windows-sign@899421db1380620b2d4e2d8ac8b6acf16fe15b99 # sentania-labs/.github main 2026-10-07
        with:
          files: ${{ github.workspace }}\dist\vcf-telegraf-helper-${{ matrix.name }}${{ matrix.ext }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Smoke test standalone binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp "dist/vcf-telegraf-helper-${{ matrix.name }}${{ matrix.ext }}" "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          "./vcf-telegraf-helper-${{ matrix.name }}${{ matrix.ext }}" --help > help.txt
          cat help.txt
          grep -q "Usage:" help.txt
          "./vcf-telegraf-helper-${{ matrix.name }}${{ matrix.ext }}" render --cpu --mem --disk --net > render.txt
          cat render.txt
          grep -q "inputs.cpu" render.txt
          "./vcf-telegraf-helper-${{ matrix.name }}${{ matrix.ext }}" > default.txt
          cat default.txt
          grep -q "VCF Operations Open Telegraf Helper" default.txt

      # macos-sign and macos-notarize clean up their own failures; this covers
      # a smoke-test failure between them (only matters on a self-hosted Mac).
      - name: Remove the signing keychain if the smoke failed (macOS)
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/signing.keychain-db}" 2>/dev/null || true

      - name: Notarize (macOS)
        if: runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-notarize@899421db1380620b2d4e2d8ac8b6acf16fe15b99 # sentania-labs/.github main 2026-10-07
        with:
          binary: dist/vcf-telegraf-helper-${{ matrix.name }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vcf-telegraf-helper-${{ matrix.name }}
          path: dist/vcf-telegraf-helper-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build Python wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist/

      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: binaries
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x binaries/vcf-telegraf-helper-linux binaries/vcf-telegraf-helper-macos-arm64 binaries/vcf-telegraf-helper-macos-x86_64 || true
          ls -l binaries/
          TAG="$GITHUB_REF_NAME"
          ASSETS="dist/*.whl dist/*.tar.gz binaries/vcf-telegraf-helper-linux binaries/vcf-telegraf-helper-macos-arm64 binaries/vcf-telegraf-helper-macos-x86_64 binaries/vcf-telegraf-helper-windows.exe"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $ASSETS \
              --repo "$GITHUB_REPOSITORY" \
              --title "vcf-ops-telegraf-helper $TAG" \
              --notes "Multi-platform standalone binaries for Linux, macOS (Apple Silicon and Intel), and Windows, plus Python package distributions."
          fi
