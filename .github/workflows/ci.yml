# Continuous integration workflow for VCF Operations Open Telegraf Helper.
# Placement (github-ci skill): GitHub-hosted runners; free on public repos.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip "ruff~=0.16.0"
          python -m pip install -e '.[gui]' pytest pytest-asyncio respx hypothesis

      - name: Lint with ruff
        run: make lint

      - name: Run test suite
        run: make test

      - name: Smoke CLI entry points
        run: |
          vcf-telegraf-helper --help
          vcf-telegraf-helper render --cpu --mem --disk --net
          vcf-telegraf-helper run --vcf-url https://vcf.local --collector 10.10.10.50 --mock-vcf --target-host target.local --connection mock --dry-run
