# Continuous integration workflow for VCF Operations Open Telegraf Helper.
# Placement (github-ci skill): GitHub-hosted runners; free on public repos.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install system graphics libraries for offscreen Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip "ruff~=0.16.0"
          python -m pip install -e '.[gui]' pytest pytest-asyncio respx hypothesis

      - name: Lint with ruff
        run: make lint

      - name: Run test suite
        run: make test

      - name: Smoke CLI entry points
        run: |
          vcf-telegraf-helper --help
          vcf-telegraf-helper render --cpu --mem --disk --net
          vcf-telegraf-helper run --vcf-url https://vcf.local --collector 10.10.10.50 --mock-vcf --target-host target.local --connection mock --dry-run
