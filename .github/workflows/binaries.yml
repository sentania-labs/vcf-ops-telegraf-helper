name: Binary builds
on:
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize binaries
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: windows-latest
            name: windows
            ext: ".exe"
          - os: macos-latest
            name: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install graphics libraries for offscreen Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gui]' pyinstaller
          python -c 'import PySide6; print("PySide6 version:", PySide6.__version__)'

      - name: Build standalone binary
        run: python scripts/build_binary.py ${{ matrix.name }}

      - name: Sign the binary (macOS)
        if: inputs.sign && runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-sign@a37e4e029c8ebb8f1810c3dd50aa035acecbe1fc # sentania-labs/.github latest merged 2026-10-07
        with:
          bundle: dist/VCF Telegraf Helper.app
          macos-cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          macos-team-id: ${{ secrets.MACOS_TEAM_ID }}

      - name: Sign the binary (Windows)
        if: inputs.sign && runner.os == 'Windows'
        uses: sentania-labs/.github/.github/actions/windows-sign@a37e4e029c8ebb8f1810c3dd50aa035acecbe1fc # sentania-labs/.github latest merged 2026-10-07
        with:
          files: ${{ github.workspace }}\dist\vcf-telegraf-helper-${{ matrix.name }}${{ matrix.ext }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Verify Authenticode signature
        if: inputs.sign && runner.os == 'Windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/vcf-telegraf-helper-windows.exe'
          if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed: $($signature.Status)" }

      - name: Verify Developer ID signature
        if: inputs.sign && runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "dist/VCF Telegraf Helper.app"

      - name: Smoke test standalone binary including Qt
        if: runner.os != 'macOS'
        run: python scripts/smoke_binary.py "dist/vcf-telegraf-helper-${{ matrix.name }}${{ matrix.ext }}"

      - name: Smoke test app bundle including Finder launch
        if: runner.os == 'macOS'
        run: python scripts/smoke_binary.py "dist/VCF Telegraf Helper.app"

      # macos-sign and macos-notarize clean up their own failures; this covers
      # a smoke-test failure between them (only matters on a self-hosted Mac).
      - name: Remove the signing keychain if the smoke failed (macOS)
        if: always() && inputs.sign && runner.os == 'macOS'
        run: security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/signing.keychain-db}" 2>/dev/null || true

      - name: Notarize (macOS)
        if: inputs.sign && runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-notarize@a37e4e029c8ebb8f1810c3dd50aa035acecbe1fc # sentania-labs/.github latest merged 2026-10-07
        with:
          bundle: dist/VCF Telegraf Helper.app
          output-zip: /tmp/stapled-app.zip
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p "dist/dmg_staging"
          cp -a "dist/VCF Telegraf Helper.app" "dist/dmg_staging/"
          ln -s /Applications "dist/dmg_staging/Applications"
          hdiutil create -volname "VCF Telegraf Helper" -srcfolder "dist/dmg_staging" -ov -format UDZO "dist/vcf-telegraf-helper-${{ matrix.name }}.dmg"
          rm -rf "dist/dmg_staging"

      - name: Import signing certificate for the DMG (macOS)
        if: runner.os == 'macOS' && inputs.sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          DMG_KEYCHAIN="$RUNNER_TEMP/dmg-signing.keychain-db"
          DMG_KEYCHAIN_PW="$(/usr/bin/openssl rand -base64 24)"
          echo "DMG_KEYCHAIN=$DMG_KEYCHAIN" >> "$GITHUB_ENV"
          security delete-keychain "$DMG_KEYCHAIN" 2>/dev/null || true
          security create-keychain -p "$DMG_KEYCHAIN_PW" "$DMG_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$DMG_KEYCHAIN"
          security unlock-keychain -p "$DMG_KEYCHAIN_PW" "$DMG_KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dmg-cert.p12"
          security import "$RUNNER_TEMP/dmg-cert.p12" -k "$DMG_KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dmg-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$DMG_KEYCHAIN_PW" "$DMG_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$DMG_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$DMG_KEYCHAIN" | grep 'Developer ID Application' || true)"
          if [ "$(printf '%s\n' "$identities" | grep -c .)" != "1" ]; then
            echo "::error::expected exactly one Developer ID Application identity for the DMG"
            exit 1
          fi
          echo "DMG_SIGN_ID=$(printf '%s\n' "$identities" | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Sign macOS DMG
        if: runner.os == 'macOS' && inputs.sign
        run: |
          codesign --force --sign "$DMG_SIGN_ID" --keychain "$DMG_KEYCHAIN" --timestamp "dist/vcf-telegraf-helper-${{ matrix.name }}.dmg"
          codesign --verify --strict --verbose=2 "dist/vcf-telegraf-helper-${{ matrix.name }}.dmg"

      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS' && inputs.sign
        env:
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          DMG="dist/vcf-telegraf-helper-${{ matrix.name }}.dmg"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/dmg-notary.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/dmg-notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 2h --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          cat "$RUNNER_TEMP/dmg-notary.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get('status')=='Accepted' else 1)" "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Remove the DMG signing keychain and notary key (macOS)
        if: always() && runner.os == 'macOS' && inputs.sign
        run: |
          security delete-keychain "${DMG_KEYCHAIN:-$RUNNER_TEMP/dmg-signing.keychain-db}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dmg-cert.p12" "$RUNNER_TEMP/dmg-notary.p8" "$RUNNER_TEMP/dmg-notary.json" 2>/dev/null || true

      - name: Verify extracted macOS download
        if: runner.os == 'macOS'
        run: python scripts/smoke_binary.py "dist/vcf-telegraf-helper-${{ matrix.name }}.dmg" ${{ inputs.sign && '--signed' || '' }}

      - name: Upload Mac launch evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finder-launch-${{ matrix.name }}
          path: dist/finder-launch.png
          if-no-files-found: error

      - name: Upload Windows launch evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-launch-windows
          path: dist/windows-launch.*
          if-no-files-found: error

      - name: Upload build-time third-party notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-${{ matrix.name }}
          path: dist/THIRD-PARTY-NOTICES-${{ matrix.name }}.txt
          if-no-files-found: error

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcf-telegraf-helper-${{ matrix.name }}
          path: dist/vcf-telegraf-helper-${{ matrix.name }}${{ runner.os == 'macOS' && '.dmg' || matrix.ext }}
          if-no-files-found: error

