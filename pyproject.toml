[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-ops-telegraf-helper"
dynamic = ["version"]
description = "Local administrator utility for VCF Operations open-source Telegraf onboarding"
authors = [{ name = "Scott" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli_w>=1.0.0",
    "requests>=2.32.3",
    "truststore>=0.10.0",
    "paramiko>=3.0.0",
    "pywinrm>=0.4.3",
    "cryptography<49",
    "tzdata",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7.2,<6.12"]  # 6.12.0 aborts at interpreter exit (pure virtual method called); see the tracking issue

[project.scripts]
vcf-telegraf-helper = "vcf_ops_telegraf_helper.cli.main:cli"

[project.gui-scripts]
vcf-telegraf-helper-gui = "vcf_ops_telegraf_helper.gui.app:run_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["vcf_ops_telegraf_helper*"]

[tool.setuptools.package-data]
"vcf_ops_telegraf_helper.gui" = ["assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools_scm]
version_file = "vcf_ops_telegraf_helper/_version.py"
fallback_version = "0.0.0"
