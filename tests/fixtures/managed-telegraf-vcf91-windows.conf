#Metrics of CPU start
[[inputs.cpu]]
  ## Whether to report per-cpu stats or not
  percpu = true
  ## Whether to report total system cpu stats or not
  totalcpu = true
  ## If true, collect raw CPU time metrics.
  collect_cpu_time = true
  ## If true, compute and report the sum of all non-idle CPU states.
  report_active = true
  name_prefix = "win."
#Metrics of CPU end

#Metrics of Memory start
[[inputs.mem]]
  name_prefix = "win."
#Metrics of Memory end

#Metrics of Swap start
[[inputs.swap]]
  name_prefix = "win."
#Metrics of Swap end

